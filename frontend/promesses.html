<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Promesses de règlement — Ma Boutique</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234F46E5'/%3E%3Cpath d='M7 12h10M12 7v10' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4F46E5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ma Boutique">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
<div class="sidebar-overlay" onclick="toggleSidebar()"></div>

<div class="app">
  <nav class="sidebar">
    <div class="brand">
      <img data-company-logo src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234F46E5'/%3E%3Cpath d='M7 12h10M12 7v10' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E" class="brand-logo" alt="Logo">
      <span data-company-name>Ma Boutique</span>
    </div>

    <div class="nav-section">
      <div class="nav-section-title">Mon Quotidien</div>
      <a href="index.html" class="nav-link"><span class="nav-emoji">🏠</span> Accueil</a>
      <a href="factures.html" class="nav-link"><span class="nav-emoji">🧾</span> Vendre</a>
      <a href="clients.html" class="nav-link"><span class="nav-emoji">👥</span> Mes Clients</a>
    </div>

    <div class="nav-section">
      <div class="nav-section-title">Mon Stock</div>
      
      <a href="stock.html" class="nav-link"><span class="nav-emoji">📊</span> Stock & Produits</a>
    </div>

    <div class="nav-section">
      <div class="nav-section-title">Mon Argent</div>
      <a href="credits.html" class="nav-link"><span class="nav-emoji">💸</span> On me doit</a>
      <a href="recouvra.html" class="nav-link premium"><span class="nav-emoji">📣</span> Relancer <span class="badge-premium">PRO</span></a>
    </div>

    <div class="sidebar-footer">
      <button class="dark-mode-toggle" onclick="toggleDarkMode()" style="width:100%; margin-bottom:8px;"><span id="dark-mode-icon">🌙</span> <span id="dark-mode-label">Mode sombre</span></button>
      <div class="hint mono" id="current-user-email" style="margin-bottom:8px;"></div>
      <button class="btn-logout" onclick="logout()">Déconnexion</button>
    </div>
  </nav>

  <main class="main">
    <div class="page-header-simple">
      <a href="index.html" class="btn-back"><span class="arrow">←</span> Retour au tableau de bord</a>
      <h1>🤝 Promesses de règlement</h1>
      <p>Enregistrez les engagements de paiement de vos clients.</p>
    </div>

    <div class="card">
      <div class="card-head">
        <h3>Créer une promesse</h3>
      </div>
      <form id="promise-form" class="form-grid">
        <label>
          Facture
          <select id="invoice" required>
            <option value="">Chargement...</option>
          </select>
        </label>
        <label>
          Client
          <input id="client-display" type="text" readonly placeholder="—">
          <input type="hidden" id="client-id">
        </label>
        <label>
          Montant promis (FCFA)
          <input id="amount" type="number" min="1" step="1" required>
        </label>
        <label>
          Date promise
          <input id="due" type="date" required>
        </label>
        <button class="btn recouvra-cta" type="submit">Enregistrer l'engagement</button>
      </form>
      <p id="promise-message" aria-live="polite"></p>
    </div>

    <div class="card">
      <div class="card-head">
        <h3>Promesses en cours</h3>
      </div>
      <div id="promises-content">
        <div class="empty-state">Chargement...</div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>
function toggleSidebar() { const sidebar = document.querySelector('.sidebar'); const overlay = document.querySelector('.sidebar-overlay'); if (sidebar) sidebar.classList.toggle('open'); if (overlay) overlay.classList.toggle('active'); document.body.classList.toggle('menu-open', sidebar?.classList.contains('open')); }
document.addEventListener('click', (e) => { if (e.target.closest('.nav-link')) { const sidebar = document.querySelector('.sidebar'); const overlay = document.querySelector('.sidebar-overlay'); if (sidebar) sidebar.classList.remove('open'); if (overlay) overlay.classList.remove('active'); document.body.classList.remove('menu-open'); } });
function toggleDarkMode() { document.body.classList.toggle('dark-mode'); const isDark = document.body.classList.contains('dark-mode'); localStorage.setItem('recouvra_dark_mode', isDark ? '1' : '0'); const icon = document.getElementById('dark-mode-icon'); const label = document.getElementById('dark-mode-label'); if (icon) icon.textContent = isDark ? '☀️' : '🌙'; if (label) label.textContent = isDark ? 'Mode clair' : 'Mode sombre'; }
function initDarkMode() { if (localStorage.getItem('recouvra_dark_mode') === '1') { document.body.classList.add('dark-mode'); const icon = document.getElementById('dark-mode-icon'); const label = document.getElementById('dark-mode-label'); if (icon) icon.textContent = '☀️'; if (label) label.textContent = 'Mode clair'; } }

document.addEventListener('DOMContentLoaded', async () => {
    initDarkMode();
    const session = await requireAuth();
    if (!session) return;

    const hasRecouvra = await requireRecouvra();
    if (!hasRecouvra) return;

    await loadInvoices();
    await loadPromises();

    document.getElementById('promise-form').addEventListener('submit', handlePromiseSubmit);
    document.getElementById('invoice').addEventListener('change', updateClientDisplay);
});

async function loadInvoices() {
    const select = document.getElementById('invoice');
    if (!select) return;
    select.innerHTML = '<option value="">Chargement...</option>';
    try {
        const { data, error } = await supabaseClient
            .from('factures')
            .select('id, numero_facture, montant_restant, client_id, clients(nom)')
            .eq('statut', 'VALIDEE')
            .gt('montant_restant', 0)
            .order('numero_facture');
        if (error) throw error;
        if (!data || data.length === 0) {
            select.innerHTML = '<option value="">Aucune facture impayée</option>';
            return;
        }
        select.innerHTML = `<option value="">Sélectionner une facture...</option>` +
            data.map(f => `<option value="${f.id}" data-client="${f.client_id}" data-client-name="${esc(f.clients?.nom || '')}" data-montant="${f.montant_restant}">${f.numero_facture} — ${f.clients?.nom || 'Client'} — ${fmtMoney(f.montant_restant)}</option>`).join('');
    } catch (error) {
        console.error('Erreur chargement factures:', error);
        select.innerHTML = '<option value="">Erreur de chargement</option>';
    }
}

function updateClientDisplay() {
    const select = document.getElementById('invoice');
    const option = select.selectedOptions[0];
    const clientDisplay = document.getElementById('client-display');
    const clientHidden = document.getElementById('client-id');
    const amount = document.getElementById('amount');
    if (clientDisplay) clientDisplay.value = option?.dataset.clientName || '';
    if (clientHidden) clientHidden.value = option?.dataset.client || '';
    if (amount) amount.value = option?.dataset.montant || '';
}

async function handlePromiseSubmit(e) {
    e.preventDefault();
    const msgEl = document.getElementById('promise-message');
    clearMsg(msgEl);
    const factureId = document.getElementById('invoice').value;
    const clientId = document.getElementById('client-id').value;
    const montant = Number(document.getElementById('amount').value);
    const datePromise = document.getElementById('due').value;
    if (!factureId || !clientId || !montant || !datePromise) {
        showMsg(msgEl, 'Veuillez remplir tous les champs obligatoires.', 'error');
        return;
    }
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.textContent = 'Enregistrement...';
    try {
        const { error } = await supabaseClient
            .from('promesses_paiement')
            .insert({
                facture_id: Number(factureId),
                client_id: Number(clientId),
                montant_promis: montant,
                date_promise: new Date(datePromise).toISOString(),
            });
        if (error) throw error;
        showMsg(msgEl, '✅ Promesse de règlement enregistrée.', 'success');
        e.target.reset();
        updateClientDisplay();
        await loadPromises();
    } catch (error) {
        showMsg(msgEl, friendlyError(error), 'error');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Enregistrer l\'engagement';
    }
}

async function loadPromises() {
    const el = document.getElementById('promises-content');
    if (!el) return;
    el.innerHTML = '<div class="empty-state">Chargement...</div>';
    try {
        await supabaseClient.rpc('verifier_promesses');
        const { data, error } = await supabaseClient
            .from('promesses_paiement')
            .select('*, clients(nom), factures(numero_facture)')
            .order('created_at', { ascending: false });
        if (error) throw error;
        if (!data || data.length === 0) {
            el.innerHTML = '<div class="empty-state">Aucune promesse enregistrée.</div>';
            return;
        }
        const statusBadge = {
            'EN_ATTENTE': '<span class="badge badge-warn">En attente</span>',
            'RESPECTEE': '<span class="badge badge-success">Respectée</span>',
            'NON_RESPECTEE': '<span class="badge badge-danger">Non respectée</span>',
            'ANNULEE': '<span class="badge badge-muted">Annulée</span>',
        };
        el.innerHTML = `
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Client</th>
                            <th>Facture</th>
                            <th>Montant promis</th>
                            <th>Date promise</th>
                            <th>Statut</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${data.map(p => `
                            <tr>
                                <td>${esc(p.clients?.nom || '—')}</td>
                                <td class="ref">${esc(p.factures?.numero_facture || '—')}</td>
                                <td class="num"><strong>${fmtMoney(p.montant_promis)}</strong></td>
                                <td class="hint">${fmtDate(p.date_promise)}</td>
                                <td>${statusBadge[p.statut] || p.statut}</td>
                                <td class="actions-cell">
                                    ${p.statut === 'EN_ATTENTE' ? `
                                        <button class="btn btn-sm btn-secondary" onclick="markPromiseRespected('${p.id}')">✓ Respectée</button>
                                        <button class="btn btn-sm btn-secondary" onclick="markPromiseNotRespected('${p.id}')">✗ Non respectée</button>
                                    ` : ''}
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>`;
    } catch (error) {
        console.error('Erreur chargement promesses:', error);
        el.innerHTML = `<div class="error-msg">${friendlyError(error)}</div>`;
    }
}

async function markPromiseRespected(id) {
    try {
        const { error } = await supabaseClient
            .from('promesses_paiement')
            .update({ statut: 'RESPECTEE', updated_at: new Date().toISOString() })
            .eq('id', id);
        if (error) throw error;
        showToast('Promesse marquée comme respectée.', 'success');
        await loadPromises();
    } catch (error) { showToast(friendlyError(error), 'error'); }
}

async function markPromiseNotRespected(id) {
    try {
        const { error } = await supabaseClient
            .from('promesses_paiement')
            .update({ statut: 'NON_RESPECTEE', updated_at: new Date().toISOString() })
            .eq('id', id);
        if (error) throw error;
        showToast('Promesse marquée comme non respectée.', 'info');
        await loadPromises();
    } catch (error) { showToast(friendlyError(error), 'error'); }
}
</script>
</body>
</html>
