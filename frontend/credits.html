<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.min.js"></script>

<script>
// ============================================================================
// CREDITS - LOGIQUE (utilise les fonctions de assets/app.js)
// ============================================================================

let allCredits = [];
let currentFilter = 'impayes';

document.addEventListener('DOMContentLoaded', async () => {
    const session = await requireAuth();
    if (!session) return;

    await loadCredits();

    // Écouter les événements de synchronisation
    document.addEventListener('recouvra:connectivity-changed', async (e) => {
        if (e.detail?.online) await loadCredits();
    });
    document.addEventListener('recouvra:pending-updates-updated', async () => {
        await loadCredits();
    });
});

// ---------- Chargement des crédits (avec cache) ----------
async function loadCredits() {
    const { items, offline, savedAt } = await loadWithCache('credits', () =>
        supabaseClient.from('factures')
            .select('id, client_id, numero_facture, montant_total, montant_restant, created_at, echeance_type, date_echeance, paye, paye_at, clients(nom, telephone)')
            .eq('mode_paiement', 'CREDIT')
            .eq('statut', 'VALIDEE')
            .order('date_echeance', { ascending: true })
    );
    allCredits = applyPendingFieldUpdates('factures', items);
    if (offline && savedAt) showToast(`Hors ligne : données du ${fmtDateTime(savedAt)}.`, 'info');
    updateStats();
    renderCredits();
}

// Correction (audit V3) : le statut "payé" était déterminé uniquement par le
// booléen `f.paye`, qui n'est mis à jour que par le bouton "Marquer payé" de
// cette page — pas par le circuit officiel de paiement (paiements.html /
// enregistrer_paiement), qui lui met à jour `montant_restant`. Un crédit réglé
// via ce circuit continuait donc à s'afficher ici comme impayé. On se base
// désormais sur `montant_restant`, la donnée que le serveur tient à jour dans
// tous les cas, `f.paye` ne servant plus que de repli si jamais absent.
function estSoldee(f) {
    if (f.montant_restant !== undefined && f.montant_restant !== null) {
        return Number(f.montant_restant) <= 0;
    }
    return !!f.paye;
}

// ---------- Statistiques ----------
function updateStats() {
    const nonPayes = allCredits.filter(f => !estSoldee(f));
    const total = nonPayes.reduce((s, f) => s + Number(f.montant_restant ?? f.montant_total), 0);
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const dansUneSemaine = new Date(today);
    dansUneSemaine.setDate(today.getDate() + 7);
    let retard = 0, semaine = 0;
    nonPayes.forEach(f => {
        if (!f.date_echeance) return;
        const d = new Date(f.date_echeance);
        if (d < today) retard++;
        else if (d <= dansUneSemaine) semaine++;
    });
    document.getElementById('stat-total').textContent = fmtMoney(total);
    document.getElementById('stat-retard').textContent = retard;
    document.getElementById('stat-semaine').textContent = semaine;
}

// ---------- Filtres ----------
function setFilter(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    renderCredits();
}

// ---------- Affichage ----------
function renderCredits() {
    const el = document.getElementById('credits-list');
    const todayStr = new Date().toISOString().slice(0, 10);
    let data = allCredits;
    if (currentFilter === 'impayes') data = data.filter(f => !estSoldee(f));
    if (currentFilter === 'retard') data = data.filter(f => !estSoldee(f) && f.date_echeance && f.date_echeance < todayStr);
    if (data.length === 0) {
        el.innerHTML = '<div class="empty-state">Aucun crédit à afficher.</div>';
        return;
    }

    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const dansUneSemaine = new Date(today);
    dansUneSemaine.setDate(today.getDate() + 7);

    const groups = new Map();
    data.forEach(f => {
        const key = f.client_id ?? f.clients?.nom ?? '—';
        if (!groups.has(key)) groups.set(key, { nom: f.clients?.nom || '—', telephone: f.clients?.telephone || '', rows: [] });
        groups.get(key).rows.push(f);
    });

    el.innerHTML = [...groups.values()].map(g => {
        const totalDu = g.rows.filter(f => !estSoldee(f)).reduce((s, f) => s + Number(f.montant_restant ?? f.montant_total), 0);
        return `<div class="credit-client-card">
            <div class="credit-client-header">
                <div class="credit-client-info">
                    <div class="credit-client-name">${esc(g.nom)}</div>
                    <div class="credit-client-phone">${g.telephone ? '📞 ' + esc(g.telephone) : ''}</div>
                </div>
                <div class="credit-client-total">
                    <span class="credit-total-label">Total dû</span>
                    <span class="credit-total-amount">${fmtMoney(totalDu)}</span>
                </div>
            </div>
            <div class="credit-invoices">
                ${g.rows.map(f => {
                    const echDate = f.date_echeance ? new Date(f.date_echeance) : null;
                    let statutLabel = 'À venir', statutClass = 'badge-info';
                    if (estSoldee(f)) { statutLabel = '✅ Payé'; statutClass = 'badge-success'; }
                    else if (echDate && echDate < today) { statutLabel = '🔴 En retard'; statutClass = 'badge-danger'; }
                    else if (echDate && echDate <= dansUneSemaine) { statutLabel = '🟠 Bientôt'; statutClass = 'badge-warning'; }
                    return `<div class="credit-invoice-row ${estSoldee(f) ? 'paid' : ''}">
                        <div class="credit-invoice-info">
                            <span class="credit-invoice-num">${esc(f.numero_facture || '—')}</span>
                            <span class="credit-invoice-date">${fmtDate(f.created_at)}</span>
                        </div>
                        <div class="credit-invoice-amount">
                            <span class="credit-invoice-montant">${fmtMoney(f.montant_restant ?? f.montant_total)}</span>
                        </div>
                        <div class="credit-invoice-status">
                            <span class="badge ${statutClass}">${statutLabel}</span>
                        </div>
                        <div class="credit-invoice-actions">
                            ${estSoldee(f) ? '' : `<button class="btn-success" onclick="marquerPaye(${f.id})">✓ Payé</button>`}
                        </div>
                    </div>`;
                }).join('')}
            </div>
        </div>`;
    }).join('');
}

// ---------- Marquer comme payé ----------
async function marquerPaye(id) {
    const ok = await confirmDialog('Marquer ce bon comme payé ?', { confirmLabel: 'Marquer payé', danger: false });
    if (!ok) return;

    const item = allCredits.find(f => f.id === id);
    const montantRestant = Number(item?.montant_restant ?? item?.montant_total ?? 0);
    const montantTotal = Number(item?.montant_total ?? 0);

    if (!appIsOnline) {
        // Correction (audit V3) : on garde désormais montant_restant /
        // montant_paye / statut_paiement cohérents avec `paye`, même hors
        // ligne (voir explication complète ci-dessous).
        const patch = {
            paye: true,
            paye_at: new Date().toISOString(),
            montant_restant: 0,
            montant_paye: montantTotal,
            statut_paiement: 'PAYEE',
        };
        queueFieldUpdate('factures', id, patch, `Bon #${id} marqué payé`);
        if (item) Object.assign(item, patch, { _pendingSync: true });
        showToast('Marqué payé hors ligne — synchronisé automatiquement au retour de la connexion.', 'info');
        updateStats();
        renderCredits();
        return;
    }

    try {
        // Correction (audit V3) : l'ancien code se contentait de basculer le
        // booléen `paye`, sans jamais recalculer montant_restant/montant_paye
        // ni créer d'enregistrement de paiement. Résultat : une facture
        // marquée "payée" depuis cette page restait visible comme IMPAYÉE
        // dans le module Recouvra (recouvra.html filtre sur
        // montant_restant > 0), et pouvait continuer à être relancée par
        // WhatsApp après avoir déjà été réglée.
        //
        // Pour une entreprise disposant du module Recouvra, on passe donc
        // par le circuit officiel enregistrer_paiement() (qui crée un vrai
        // enregistrement de paiement et recalcule les champs dérivés).
        // Sans ce module, ce circuit n'est pas accessible (has_recouvra
        // requis côté serveur) : on met alors à jour directement les champs
        // dérivés, pour rester cohérent si le module est activé plus tard.
        const profile = await currentProfile();

        if (profile?.has_recouvra && montantRestant > 0) {
            const { error } = await supabaseClient.rpc('enregistrer_paiement', {
                p_facture_id: id,
                p_montant: montantRestant,
                p_methode: 'AUTRE',
                p_note: 'Marqué payé depuis la page Crédits',
            });
            if (error) throw error;
        } else {
            const { error } = await supabaseClient
                .from('factures')
                .update({
                    paye: true,
                    paye_at: new Date().toISOString(),
                    montant_restant: 0,
                    montant_paye: montantTotal,
                    statut_paiement: 'PAYEE',
                })
                .eq('id', id);
            if (error) throw error;
        }

        showToast('Bon marqué comme payé.', 'success');
        await loadCredits();
    } catch (error) {
        showToast(friendlyError(error), 'error');
    }
}
</script>
