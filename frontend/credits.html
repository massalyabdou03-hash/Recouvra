<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>On me doit — Ma Boutique</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234F46E5'/%3E%3Cpath d='M7 12h10M12 7v10' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4F46E5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ma Boutique">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/style.css">

<style>
/* ============================================================================
   MENU MOBILE + MODE SOMBRE GLOBAL
   ============================================================================ */

.mobile-menu-btn {
    display: none;
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 1001;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    border: none;
    background: #4F46E5;
    color: white;
    font-size: 24px;
    cursor: pointer;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 12px rgba(79,70,229,0.3);
}

.sidebar-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 999;
}

.sidebar-overlay.active {
    display: block;
}

@media (max-width: 768px) {
    .mobile-menu-btn {
        display: flex;
    }
    .sidebar {
        position: fixed;
        top: 0;
        left: -280px;
        width: 280px;
        height: 100vh;
        transition: left 0.3s ease;
        z-index: 1000;
        overflow-y: auto;
    }
    .sidebar.open {
        left: 0;
    }
    .main {
        padding-left: 16px;
        padding-right: 16px;
        padding-top: 60px;
    }
}

body.dark-mode {
    --surface: #1F2937;
    --surface-2: #374151;
    --surface-3: #4B5563;
    --border: #4B5563;
    --border-soft: #374151;
    --text: #F9FAFB;
    --text-muted: #9CA3AF;
    --text-light: #6B7280;
    background: #111827;
    color: #F9FAFB;
}

body.dark-mode .card,
body.dark-mode .sidebar {
    background: #1F2937;
    border-color: #374151;
}

body.dark-mode .nav-link {
    color: #9CA3AF;
}

body.dark-mode .nav-link.active {
    background: #4F46E5;
    color: white;
}

body.dark-mode table {
    background: #1F2937;
}

body.dark-mode th {
    background: #374151;
    color: #9CA3AF;
}

body.dark-mode td {
    border-color: #374151;
}

body.dark-mode input,
body.dark-mode select,
body.dark-mode textarea {
    background: #374151;
    border-color: #4B5563;
    color: #F9FAFB;
}

body.dark-mode .btn-secondary {
    background: #374151;
    border-color: #4B5563;
    color: #F9FAFB;
}

body.dark-mode .empty-state {
    color: #9CA3AF;
}

body.dark-mode .hint {
    color: #9CA3AF;
}

/* ============================================================================
   PAGE ON ME DOIT - CARTES CRÉDITS
   ============================================================================ */

.page-header-simple {
    margin-bottom: 24px;
}

.page-header-simple h1 {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 4px;
}

.page-header-simple p {
    color: #888;
    font-size: 15px;
}

.credit-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
}

.credit-stat-card {
    background: white;
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    border: 1px solid #eee;
}

.credit-stat-card.danger {
    background: #FEE2E2;
    border-color: #EF4444;
}

.credit-stat-card.warning {
    background: #FEF3C7;
    border-color: #F59E0B;
}

.credit-stat-value {
    font-size: 28px;
    font-weight: 800;
    display: block;
    margin-bottom: 4px;
}

.credit-stat-label {
    font-size: 12px;
    color: #888;
    font-weight: 600;
    text-transform: uppercase;
}

.credit-filters {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
}

.filter-btn {
    padding: 10px 20px;
    border-radius: 20px;
    border: 1px solid #e5e7eb;
    background: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
}

.filter-btn.active {
    background: #4F46E5;
    color: white;
    border-color: #4F46E5;
}

.filter-btn:hover:not(.active) {
    background: #F3F4F6;
}

.credits-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.credit-client-card {
    background: white;
    border-radius: 16px;
    padding: 20px;
    border: 1px solid #eee;
}

.credit-client-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid #f3f4f6;
}

.credit-client-info {
    flex: 1;
}

.credit-client-name {
    font-weight: 700;
    font-size: 18px;
    margin-bottom: 4px;
}

.credit-client-phone {
    font-size: 13px;
    color: #888;
}

.credit-client-total {
    text-align: right;
}

.credit-total-label {
    font-size: 12px;
    color: #888;
    display: block;
    margin-bottom: 2px;
}

.credit-total-amount {
    font-size: 24px;
    font-weight: 800;
    color: #EF4444;
}

.credit-invoices {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.credit-invoice-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    background: #fafafa;
    border-radius: 8px;
    transition: background 0.2s;
}

.credit-invoice-row.paid {
    opacity: 0.6;
    background: #f0fdf4;
}

.credit-invoice-info {
    flex: 1;
}

.credit-invoice-num {
    font-weight: 600;
    font-size: 14px;
    display: block;
}

.credit-invoice-date {
    font-size: 12px;
    color: #888;
}

.credit-invoice-amount {
    font-weight: 700;
    font-size: 16px;
    text-align: right;
    min-width: 100px;
}

.credit-invoice-status {
    min-width: 100px;
    text-align: center;
}

.credit-invoice-actions {
    min-width: 80px;
    text-align: right;
}

.btn-success {
    background: #10B981;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
}

.btn-success:hover {
    background: #059669;
}

body.dark-mode .credit-client-card {
    background: #1F2937;
    border-color: #374151;
}

body.dark-mode .credit-invoice-row {
    background: #374151;
}

body.dark-mode .credit-invoice-row.paid {
    background: #064E3B;
}

body.dark-mode .credit-stat-card {
    background: #1F2937;
    border-color: #374151;
}

body.dark-mode .filter-btn {
    background: #374151;
    border-color: #4B5563;
    color: #F9FAFB;
}

body.dark-mode .credit-client-name {
    color: #F9FAFB;
}

/* --- Responsive --- */
@media (max-width: 600px) {
    .credit-client-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
    }
    
    .credit-client-total {
        text-align: left;
    }
    
    .credit-invoice-row {
        flex-wrap: wrap;
    }
    
    .credit-invoice-amount {
        min-width: auto;
    }
    
    .credit-invoice-status {
        min-width: auto;
    }
}
</style>
</head>
<body>

<!-- ========== MENU MOBILE ========== -->
<button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
<div class="sidebar-overlay" onclick="toggleSidebar()"></div>

<div class="app">
  <nav class="sidebar">
    <div class="brand">
      <img data-company-logo src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234F46E5'/%3E%3Cpath d='M7 12h10M12 7v10' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E" class="brand-logo" alt="Logo">
      <span data-company-name>Ma Boutique</span>
    </div>

    <div class="nav-section">
      <div class="nav-section-title">Mon Quotidien</div>
      <a href="index.html" class="nav-link">
        <span class="nav-emoji">🏠</span> Accueil
      </a>
      <a href="factures.html" class="nav-link">
        <span class="nav-emoji">🧾</span> Vendre
      </a>
      <a href="clients.html" class="nav-link">
        <span class="nav-emoji">👥</span> Mes Clients
      </a>
    </div>

    <div class="nav-section">
      <div class="nav-section-title">Mon Stock</div>
      <a href="catalogue.html" class="nav-link">
        <span class="nav-emoji">📦</span> Mes Articles
      </a>
      <a href="stock.html" class="nav-link">
        <span class="nav-emoji">📊</span> Stock & Produits
      </a>
    </div>

    <div class="nav-section">
      <div class="nav-section-title">Mon Argent</div>
      <a href="credits.html" class="nav-link active">
        <span class="nav-emoji">💸</span> On me doit
      </a>
      <a href="recouvra.html" class="nav-link premium">
        <span class="nav-emoji">📣</span> Relancer
        <span class="badge-premium">PRO</span>
      </a>

    <div class="sidebar-footer">
      <!-- ========== MODE SOMBRE ========== -->
      <button class="dark-mode-toggle" onclick="toggleDarkMode()" style="width:100%; margin-bottom:8px;">
        <span id="dark-mode-icon">🌙</span>
        <span id="dark-mode-label">Mode sombre</span>
      </button>
      
      <div class="hint mono" id="current-user-email" style="margin-bottom:8px;"></div>
      <button class="btn-logout" onclick="logout()">Déconnexion</button>
    </div>
  </nav>

  <main class="main">
    
    <div class="page-header-simple">
      <h1>💸 On me doit de l'argent</h1>
      <p>Les clients qui ont pris des articles à crédit.</p>
    </div>

    <!-- Statistiques rapides -->
    <div class="credit-stats">
      <div class="credit-stat-card danger">
        <span class="credit-stat-value" id="stat-total">—</span>
        <span class="credit-stat-label">Total dû</span>
      </div>
      <div class="credit-stat-card danger">
        <span class="credit-stat-value" id="stat-retard">—</span>
        <span class="credit-stat-label">En retard</span>
      </div>
      <div class="credit-stat-card warning">
        <span class="credit-stat-value" id="stat-semaine">—</span>

      </div>
    </div>

    <!-- Filtres -->
    <div class="credit-filters">
      <button class="filter-btn active" onclick="setFilter('impayes', this)">Non payés</button>
      <button class="filter-btn" onclick="setFilter('retard', this)">En retard</button>
      <button class="filter-btn" onclick="setFilter('tous', this)">Tous</button>
    </div>

    <!-- Liste des crédits -->
    <div class="credits-list" id="credits-list">
      <div class="empty-state">Chargement...</div>
    </div>

  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>
// ============================================================================
// MENU MOBILE + MODE SOMBRE
// ============================================================================

function toggleSidebar() {
    const sidebar = document.querySelector('.sidebar');
    const overlay = document.querySelector('.sidebar-overlay');
    if (sidebar) sidebar.classList.toggle('open');
    if (overlay) overlay.classList.toggle('active');
}

document.addEventListener('click', (e) => {
    if (e.target.closest('.nav-link')) {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.sidebar-overlay');
        if (sidebar) sidebar.classList.remove('open');
        if (overlay) overlay.classList.remove('active');
    }
});

function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    localStorage.setItem('recouvra_dark_mode', isDark ? '1' : '0');
    const icon = document.getElementById('dark-mode-icon');
    const label = document.getElementById('dark-mode-label');
    if (icon) icon.textContent = isDark ? '☀️' : '🌙';
    if (label) label.textContent = isDark ? 'Mode clair' : 'Mode sombre';
}

function initDarkMode() {
    if (localStorage.getItem('recouvra_dark_mode') === '1') {
        document.body.classList.add('dark-mode');
        const icon = document.getElementById('dark-mode-icon');
        const label = document.getElementById('dark-mode-label');
        if (icon) icon.textContent = '☀️';
        if (label) label.textContent = 'Mode clair';
    }
}

// ============================================================================
// ON ME DOIT - LOGIQUE
// ============================================================================

let allCredits = [];
let currentFilter = 'impayes';

document.addEventListener('DOMContentLoaded', async () => {
    initDarkMode();
    
    const session = await requireAuth();
    if (!session) return;

    await loadCredits();
});

async function loadCredits() {
    const { items, offline, savedAt } = await loadWithCache('credits', () =>
        supabaseClient
            .from('factures')
            .select('id, client_id, numero_facture, montant_total, montant_restant, created_at, echeance_type, date_echeance, paye, paye_at, clients(nom, telephone)')
            .eq('mode_paiement', 'CREDIT')
            .eq('statut', 'VALIDEE')
            .order('date_echeance', { ascending: true })
    );

    allCredits = applyPendingFieldUpdates('factures', items);

    if (offline && savedAt) {
        showToast(`Hors ligne : données du ${fmtDateTime(savedAt)}.`, 'info');
    }

    updateStats();
    renderCredits();
}

function updateStats() {
    const nonPayes = allCredits.filter(f => !f.paye);
    const total = nonPayes.reduce((s, f) => s + Number(f.montant_restant ?? f.montant_total), 0);

    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const dansUneSemaine = new Date(today);
    dansUneSemaine.setDate(today.getDate() + 7);

    let retard = 0;
    let semaine = 0;

    nonPayes.forEach(f => {
        if (!f.date_echeance) return;
        const d = new Date(f.date_echeance);
        if (d < today) retard++;
        else if (d <= dansUneSemaine) semaine++;
    });

    document.getElementById('stat-total').textContent = fmtMoney(total);
    document.getElementById('stat-retard').textContent = retard;
    document.getElementById('stat-semaine').textContent = semaine;
}

function setFilter(filter, btn) {
    currentFilter = filter;
    
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    
    renderCredits();
}

function renderCredits() {
    const el = document.getElementById('credits-list');
    const todayStr = new Date().toISOString().slice(0, 10);

    let data = allCredits;
    if (currentFilter === 'impayes') data = data.filter(f => !f.paye);
    if (currentFilter === 'retard') data = data.filter(f => !f.paye && f.date_echeance && f.date_echeance < todayStr);

    if (data.length === 0) {
        el.innerHTML = `<div class="empty-state">Aucun crédit à afficher.</div>`;
        return;
    }

    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const dansUneSemaine = new Date(today);
    dansUneSemaine.setDate(today.getDate() + 7);

    const groups = new Map();
    data.forEach(f => {
        const key = f.client_id ?? f.clients?.nom ?? '—';
        if (!groups.has(key)) groups.set(key, { nom: f.clients?.nom || '—', telephone: f.clients?.telephone || '', rows: [] });
        groups.get(key).rows.push(f);
    });

    el.innerHTML = [...groups.values()].map(g => {
        const totalDu = g.rows.filter(f => !f.paye).reduce((s, f) => s + Number(f.montant_restant ?? f.montant_total), 0);
        
        return `
            <div class="credit-client-card">
                <div class="credit-client-header">
                    <div class="credit-client-info">
                        <div class="credit-client-name">${esc(g.nom)}</div>
                        <div class="credit-client-phone">${g.telephone ? '📞 ' + esc(g.telephone) : ''}</div>
                    </div>
                    <div class="credit-client-total">
                        <span class="credit-total-label">Total dû</span>
                        <span class="credit-total-amount">${fmtMoney(totalDu)}</span>
                    </div>
                </div>
                
                <div class="credit-invoices">
                    ${g.rows.map(f => {
                        const echDate = f.date_echeance ? new Date(f.date_echeance) : null;
                        let statutLabel = 'À venir';
                        let statutClass = 'badge-info';
                        
                        if (f.paye) {
                            statutLabel = '✅ Payé';
                            statutClass = 'badge-success';
                        } else if (echDate && echDate < today) {
                            statutLabel = '🔴 En retard';
                            statutClass = 'badge-danger';
                        } else if (echDate && echDate <= dansUneSemaine) {
                            statutLabel = '🟠 Bientôt';
                            statutClass = 'badge-warning';
                        }
                        
                        return `
                            <div class="credit-invoice-row ${f.paye ? 'paid' : ''}">
                                <div class="credit-invoice-info">
                                    <span class="credit-invoice-num">${esc(f.numero_facture || '—')}</span>
                                    <span class="credit-invoice-date">${fmtDate(f.created_at)}</span>
                                </div>
                                <div class="credit-invoice-amount">
                                    <span class="credit-invoice-montant">${fmtMoney(f.montant_restant ?? f.montant_total)}</span>
                                </div>
                                <div class="credit-invoice-status">
                                    <span class="badge ${statutClass}">${statutLabel}</span>
                                </div>
                                <div class="credit-invoice-actions">
                                    ${f.paye ? '' : `
                                        <button class="btn-success" onclick="marquerPaye(${f.id})">
                                            ✓ Payé
                                        </button>
                                    `}
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            </div>
        `;
    }).join('');
}

async function marquerPaye(id) {
    const ok = await confirmDialog('Marquer ce bon comme payé ?', {
        confirmLabel: 'Marquer payé',
        danger: false
    });
    if (!ok) return;

    if (!appIsOnline) {
        const patch = { paye: true, paye_at: new Date().toISOString() };
        queueFieldUpdate('factures', id, patch, `Bon #${id} marqué payé`);
        const item = allCredits.find(f => f.id === id);
        if (item) Object.assign(item, patch, { _pendingSync: true });
        showToast('Marqué payé hors ligne — synchronisé automatiquement au retour de la connexion.', 'info');
        updateStats();
        renderCredits();
        return;
    }

    const { error } = await supabaseClient
        .from('factures')
        .update({ paye: true, paye_at: new Date().toISOString() })
        .eq('id', id);

    if (error) {
        showToast(friendlyError(error), 'error');
        return;
    }

    showToast('Bon marqué comme payé.', 'success');
    await loadCredits();
}

// Écouter les changements de connectivité
document.addEventListener('sylla:connectivity-changed', async (e) => {
    if (e.detail?.online) {
        await loadCredits();
    }
});

document.addEventListener('sylla:pending-updates-updated', async () => {
    await loadCredits();
});
</script>
</body>
</html>
