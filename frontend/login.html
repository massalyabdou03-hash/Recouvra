<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion</title><link rel="stylesheet" href="assets/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script></head><body data-public><main class="shell"><section class="panel access-panel"><span class="eyebrow">Sylla Automobile</span><h1>Gestion Stock & Recouvra</h1><form id="login" class="cards"><label>Email<input type="email" id="email" required></label><label>Mot de passe<input type="password" id="password" required></label><button class="button">Se connecter</button></form><p id="error"></p></section></main><script>login.onsubmit=async e=>{e.preventDefault();const {error}=await supabaseClient.auth.signInWithPassword({email:email.value,password:password.value});if(error){document.querySelector('#error').textContent=error.message;return}location.href='index.html'}</script></body></html>
