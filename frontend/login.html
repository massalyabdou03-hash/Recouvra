<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Recouvra</title>
    <link rel="stylesheet" href="assets/style.css">
    <!-- Autres métas et liens -->
</head>
<body>
    <main class="login-shell">
        <div class="login-card">
            <div class="brand">
                <img src="assets/img/logo.png" alt="Recouvra" height="48">
                <h1>Recouvra</h1>
                <p>Connectez-vous à votre espace</p>
            </div>

            <div id="login-error" class="error-msg"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="votre@email.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-login">Se connecter</button>
            </form>

            <div class="login-footer">
                Pas encore de compte ? <a href="signup.html">S'inscrire</a>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.min.js"></script>
    <script src="assets/config.js"></script>
    <script src="assets/app.js"></script>
    <script>
    <script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const errorMsg = document.getElementById('login-error');
    const btn = document.querySelector('.btn-login');

    if (form) {
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            // Réinitialiser le message d'erreur
            errorMsg.classList.remove('show');
            errorMsg.textContent = '';

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                errorMsg.textContent = 'Veuillez remplir tous les champs.';
                errorMsg.classList.add('show');
                return;
            }

            // Désactiver le bouton et afficher le spinner
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Connexion...';

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) throw error;

                // Rediriger vers l'accueil
                window.location.href = 'index.html';

            } catch (err) {
                console.error('Erreur connexion:', err);
                errorMsg.textContent = err.message || 'Identifiants incorrects.';
                errorMsg.classList.add('show');
                btn.disabled = false;
                btn.innerHTML = 'Se connecter';
            }
        });
    }
});
</script>
    </script>
</body>
</html>
