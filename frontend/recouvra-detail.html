<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Détail recouvrement</title><link rel="stylesheet" href="assets/style.css"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#4F46E5"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Recouvra"><link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.min.js"></script><script src="assets/config.js"></script><script src="assets/app.js" defer></script></head><body><div class="app"><nav class="sidebar"></nav><main class="main"><a href="index.html" class="btn-back" style="margin-bottom:16px;"><span class="arrow">←</span> Retour au tableau de bord</a><header class="topbar"><h1>Détail du recouvrement</h1><nav class="subnav"><a href="recouvra.html">Recouvra</a><a href="paiements.html">Paiements</a><a href="promesses.html">Promesses de règlement</a><a href="relances.html">Relances</a></nav></header><section id="detail" class="cards"></section></main></div><script>document.addEventListener('DOMContentLoaded',async()=>{await requireRecouvra();const id=new URLSearchParams(location.search).get('id');const {data,error}=await supabaseClient.from('factures').select('*,clients(nom,telephone,email),paiements(*)').eq('id',id).single();if(error||!data){detail.innerHTML='<p>Facture introuvable.</p>';return}detail.innerHTML=`<article class="panel"><span class="eyebrow">${esc(data.numero_facture||`Facture #${data.id}`)}</span><h2>${esc(data.clients?.nom||'Client')}</h2><p>Total : <strong>${money(data.montant_total)}</strong></p><p>Payé : ${money(data.montant_paye)} · Solde : <strong>${money(data.montant_restant)}</strong></p><div class="progress"><i style="width:${Math.min(100,Number(data.montant_paye||0)/Math.max(Number(data.montant_total||1),1)*100)}%"></i></div><h3>Historique des paiements</h3><div class="cards">${(data.paiements||[]).map(p=>`<div class="card"><strong>${money(p.montant)}</strong><br>${esc(p.methode)} · ${date(p.date_paiement)}</div>`).join('')||'<p>Aucun paiement.</p>'}</div></article>`})</script>
</body></html>
