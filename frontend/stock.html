<body>
<div class="app">
  
  <!-- ==================== NAVIGATION SIMPLIFIÉE ==================== -->

    <div class="brand">
      <img data-company-logo src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234F46E5'/%3E%3Cpath d='M7 12h10M12 7v10' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E" class="brand-logo" alt="Logo">
      <span data-company-name>Ma Boutique</span>

    <div class="nav-section">
      <div class="nav-section-title">Mon Quotidien</div>

    <div class="nav-section">

  <!-- ==================== CONTENU PRINCIPAL ==================== -->
  <main class="main">
    
    <!-- En-tête -->
    <div class="page-header-simple">
      <h1>🔄 Entrées / Sorties</h1>
      <p>Enregistrez les mouvements de votre stock.</p>
    </div>

    <!-- Formulaire de mouvement -->
    <div class="card">
      <h3>Nouveau mouvement</h3>
      
      <!-- Type de mouvement (GROS BOUTONS) -->
      <div class="mvt-type-selector">
        <button type="button" class="mvt-type-btn entree active" onclick="setType('ENTREE', this)">
          <span class="mvt-type-icon">📥</span>
          <span class="mvt-type-label">Entrée</span>
          <span class="mvt-type-desc">Réception fournisseur</span>
        </button>
        <button type="button" class="mvt-type-btn sortie" onclick="setType('SORTIE', this)">
          <span class="mvt-type-icon">📤</span>
          <span class="mvt-type-label">Sortie</span>
          <span class="mvt-type-desc">Casse, prêt, usage</span>
        </button>
        <button type="button" class="mvt-type-btn ajustement" onclick="setType('AJUSTEMENT', this)">
          <span class="mvt-type-icon">⚖️</span>
          <span class="mvt-type-label">Ajustement</span>
          <span class="mvt-type-desc">Inventaire physique</span>
        </button>
      </div>

      <!-- Recherche article -->
      <div class="mvt-form-group">
        <label>Article *</label>
        <div class="search-bar-big">
          <input type="text" id="piece-search-input" placeholder="🔍 Rechercher un article..." autocomplete="off">
        </div>
        <div id="piece-search-results" class="search-results"></div>
        <div id="selected-piece" class="selected-piece"></div>
      </div>

      <!-- Quantité -->
      <div class="mvt-form-group">
        <label id="qty-label">Quantité *</label>
        <div class="quantity-input-wrap">
          <input type="number" id="quantite" min="1" step="1" placeholder="Ex: 10">
          <span class="qty-unit" id="qty-unite"></span>
        </div>
      </div>

      <!-- Motif -->
      <div class="mvt-form-group">
        <label>Motif (optionnel)</label>
        <input type="text" id="motif" placeholder="Ex: Réception BL-4521">
      </div>

      <!-- Bouton enregistrer -->
      <button type="button" class="btn-primary-big" onclick="submitMovement()">
        ✅ Enregistrer le mouvement
      </button>
      
      <div id="form-msg" class="form-msg"></div>
    </div>

    <!-- Historique récent -->
    <div class="card">
      <div class="card-head">
        <h3>Historique récent</h3>
      </div>
      <div id="historique-content">
        <div class="empty-state">Chargement...</div>
      </div>
    </div>

  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>
// ============================================================================
// ENTRÉES / SORTIES - VERSION SIMPLIFIÉE
// ============================================================================

let allProducts = [];
let selectedProduct = null;
let currentType = 'ENTREE';

document.addEventListener('DOMContentLoaded', async () => {
    const session = await requireAuth();
    if (!session) return;

    await loadProducts();
    loadHistorique();

    // Recherche article
    const searchInput = document.getElementById('piece-search-input');
    searchInput.addEventListener('input', searchProducts);
    searchInput.addEventListener('focus', () => {
        if (searchInput.value) searchProducts();
    });
});

async function loadProducts() {
    const { items, offline, savedAt } = await loadWithCache('pieces', () =>
        fetchAllRows(() => supabaseClient.from('pieces').select('*').eq('actif', true).order('designation'))
    );
    allProducts = items;
    if (offline && savedAt) {
        showToast(`Hors ligne : données du ${fmtDateTime(savedAt)}.`, 'info');
    }
}

// --- Sélection du type ---
function setType(type, btn) {
    currentType = type;
    
    document.querySelectorAll('.mvt-type-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    
    const qtyLabel = document.getElementById('qty-label');
    qtyLabel.textContent = type === 'AJUSTEMENT' ? 'Nouvelle quantité réelle *' : 'Quantité *';
    
    updateSelectedProductInfo();
}

// --- Recherche produit ---
function searchProducts() {
    const q = document.getElementById('piece-search-input').value.trim().toLowerCase();
    const resultsEl = document.getElementById('piece-search-results');
    
    if (!q) {
        resultsEl.innerHTML = '';
        resultsEl.style.display = 'none';
        return;
    }
    
    const results = allProducts.filter(p =>
        (p.designation || '').toLowerCase().includes(q) ||
        (p.reference_oem || '').toLowerCase().includes(q) ||
        (p.marque || '').toLowerCase().includes(q)
    ).slice(0, 8);
    
    if (results.length === 0) {
        resultsEl.innerHTML = `<div class="search-result-empty">Aucun article trouvé</div>`;
        resultsEl.style.display = 'block';
        return;
    }
    
    resultsEl.innerHTML = results.map(p => `
        <div class="search-result-item" onclick="selectProduct(${p.id})">
            <span class="search-result-name">${esc(p.designation)}</span>
            <span class="search-result-stock">Stock: ${p.quantite_stock}</span>
        </div>
    `).join('');
    
    resultsEl.style.display = 'block';
}

function selectProduct(id) {
    const product = allProducts.find(p => p.id === id);
    if (!product) return;
    
    selectedProduct = product;
    
    // Mettre à jour l'interface
    document.getElementById('piece-search-input').value = product.designation;
    document.getElementById('piece-search-results').style.display = 'none';
    
    const selectedEl = document.getElementById('selected-piece');
    selectedEl.innerHTML = `
        <div class="selected-product-info">
            <span class="selected-product-name">${esc(product.designation)}</span>
            <span class="selected-product-ref">${esc(product.reference_oem || '')}</span>
            <span class="selected-product-price">${fmtMoney(product.prix_vente)}</span>
        </div>
        <span class="selected-product-stock">Stock: ${product.quantite_stock} ${MEASURE_UNIT_LABELS[product.unite_mesure] || 'pcs'}</span>
    `;
    
    // Mettre à jour l'unité
    const qtyInput = document.getElementById('quantite');
    const qtyUnite = document.getElementById('qty-unite');
    
    qtyInput.step = product.permettre_fractionnement ? '0.01' : '1';
    qtyInput.min = product.permettre_fractionnement ? '0.01' : '1';
    qtyUnite.textContent = MEASURE_UNIT_LABELS[product.unite_mesure] || 'pcs';
    
    updateSelectedProductInfo();
    qtyInput.focus();
}

function updateSelectedProductInfo() {
    // Si on change le type, on pourrait avoir besoin de changer le hint
    if (selectedProduct) {
        // rien de spécial pour l'instant
    }
}

// --- Enregistrer le mouvement ---
async function submitMovement() {
    const msgEl = document.getElementById('form-msg');
    clearMsg(msgEl);
    
    if (!selectedProduct) {
        showMsg(msgEl, 'Sélectionnez un article.');
        return;
    }
    
    const quantite = Number(document.getElementById('quantite').value);
    const motif = document.getElementById('motif').value.trim() || null;
    
    if (!quantite || quantite <= 0) {
        showMsg(msgEl, 'Quantité invalide.');
        return;
    }
    
    // Vérifier stock pour sortie
    if (currentType === 'SORTIE' && quantite > selectedProduct.quantite_stock) {
        showMsg(msgEl, `Stock insuffisant. Disponible: ${selectedProduct.quantite_stock}`);
        return;
    }
    
    const btn = document.querySelector('.btn-primary-big');
    btn.disabled = true;
    btn.textContent = 'Enregistrement...';
    
    try {
        if (!appIsOnline) {
            queuePendingMovement({
                piece_id: selectedProduct.id,
                piece_designation: selectedProduct.designation,
                type_mouvement: currentType,
                quantite: quantite,
                motif: motif,
            });
            showToast('Mouvement enregistré hors ligne — synchronisé automatiquement.', 'info');
            resetForm();
            loadHistorique();
            return;
        }
        
        const { error } = await supabaseClient.rpc('enregistrer_mouvement_stock', {
            p_piece_id: selectedProduct.id,
            p_type: currentType,
            p_quantite: quantite,
            p_motif: motif,
        });
        
        if (error) throw error;
        
        showToast('Mouvement enregistré avec succès.', 'success');
        resetForm();
        await loadProducts();
        loadHistorique();
        
    } catch (error) {
        showMsg(msgEl, friendlyError(error));
    } finally {
        btn.disabled = false;
        btn.textContent = '✅ Enregistrer le mouvement';
    }
}

function resetForm() {
    selectedProduct = null;
    document.getElementById('piece-search-input').value = '';
    document.getElementById('quantite').value = '';
    document.getElementById('motif').value = '';
    document.getElementById('selected-piece').innerHTML = '';
    document.getElementById('piece-search-results').style.display = 'none';
}

// --- Historique ---
async function loadHistorique() {
    const el = document.getElementById('historique-content');
    
    const { items, offline, savedAt } = await loadWithCache('mouvements', () =>
        supabaseClient
            .from('mouvements_stock')
            .select('id, type_mouvement, quantite, quantite_avant, quantite_apres, motif, created_at, pieces(designation, reference_interne, unite_mesure)')
            .order('created_at', { ascending: false })
            .limit(30)
    );
    
    const pending = getPendingMovements()
        .filter(m => m.status !== 'done')
        .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    
    if (offline && savedAt) {
        showToast(`Historique hors ligne : données du ${fmtDateTime(savedAt)}.`, 'info');
    }
    
    if (items.length === 0 && pending.length === 0) {
        el.innerHTML = `<div class="empty-state">Aucun mouvement enregistré.</div>`;
        return;
    }
    
    const badgeClass = { ENTREE: 'badge-success', SORTIE: 'badge-danger', AJUSTEMENT: 'badge-warning' };
    const label = { ENTREE: '📥 Entrée', SORTIE: '📤 Sortie', AJUSTEMENT: '⚖️ Ajustement' };
    
    el.innerHTML = `
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Article</th>
                        <th>Type</th>
                        <th>Quantité</th>
                        <th>Motif</th>
                    </tr>
                </thead>
                <tbody>
                    ${pending.map(m => `
                        <tr class="pending-row">
                            <td class="hint">${fmtDateTime(m.createdAt)}</td>
                            <td>${esc(m.piece_designation || '—')}</td>
                            <td><span class="badge ${badgeClass[m.type_mouvement]}">${label[m.type_mouvement]}</span></td>
                            <td class="num">${m.quantite}</td>
                            <td class="hint">${esc(m.motif || '—')} <span class="badge badge-info">⏳ En attente</span></td>
                        </tr>
                    `).join('')}
                    
                    ${items.map(m => `
                        <tr>
                            <td class="hint">${fmtDateTime(m.created_at)}</td>
                            <td>${esc(m.pieces?.designation || '—')}</td>
                            <td><span class="badge ${badgeClass[m.type_mouvement]}">${label[m.type_mouvement]}</span></td>
                            <td class="num">${m.quantite}</td>
                            <td class="hint">${esc(m.motif || '—')}</td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        </div>
    `;
}

// Écouter les changements
document.addEventListener('sylla:connectivity-changed', async (e) => {
    if (e.detail?.online) {
        await loadProducts();
        loadHistorique();
    }
});

document.addEventListener('sylla:pending-movements-updated', loadHistorique);

// Fermer les résultats si on clique ailleurs
document.addEventListener('click', (e) => {
    if (!e.target.closest('#piece-search-input') && !e.target.closest('#piece-search-results')) {
        document.getElementById('piece-search-results').style.display = 'none';
    }
});
</script>
</body>
