<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paramètres entreprise</title><link rel="stylesheet" href="assets/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script><script src="assets/app.js" defer></script><script src="assets/parametres.js" defer></script></head><body><div class="app"><nav class="sidebar"></nav><main class="main"><a href="index.html" class="btn-back" style="margin-bottom:16px;"><span class="arrow">←</span> Retour au tableau de bord</a><section class="settings-page"><div class="settings-heading"><span class="eyebrow">Configuration</span><h1>Paramètres entreprise</h1><p>Personnalisez l'identité et les coordonnées utilisées dans toute votre plateforme.</p></div><section class="settings-card"><form id="settings-form" class="settings-form"><div class="settings-section"><div><h2>Identité</h2><p>Ces informations apparaissent dans la navigation et les factures.</p></div><div class="settings-fields"><label>Nom commercial<input id="name" required></label><label>Téléphone / WhatsApp<input id="phone" inputmode="tel"></label><label>Email professionnel<input id="email" type="email"></label><label>Adresse<textarea id="address"></textarea></label><label>Identifiant fiscal<input id="tax"></label><label>Logo de l'entreprise<input id="logo-file" type="file" accept="image/png,image/jpeg,image/webp"></label><label>Ou logo (URL publique)<input id="logo" type="url" placeholder="https://..."></label></div></div><div class="settings-section"><div><h2>Apparence</h2><p>Choisissez les couleurs de votre espace.</p></div><div class="settings-fields settings-colors"><label>Couleur primaire<input id="primary" type="color"></label><label>Couleur secondaire<input id="secondary" type="color"></label></div></div><div class="settings-actions"><button class="button" type="submit">Enregistrer les paramètres</button><span id="message" class="settings-message" aria-live="polite"></span></div></form></section></section></main></div></body></html>
