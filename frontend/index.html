<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tableau de bord</title><link rel="stylesheet" href="assets/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script><script src="assets/app.js" defer></script></head><body><main class="shell"><header class="topbar"><div><span class="eyebrow">Tableau de bord</span><div class="brand" data-company-name>Entreprise</div></div><nav><a href="recouvra.html">Recouvra</a><a href="parametres.html">Paramètres</a><a href="#" onclick="logout()">Sortir</a></nav></header><section class="grid"><article class="metric"><span class="eyebrow">Recouvrement du mois</span><strong id="collected">-</strong></article><article class="metric"><span class="eyebrow">Factures en retard</span><strong id="late">-</strong></article><article class="metric"><span class="eyebrow">Encaissements du jour</span><strong id="today">-</strong></article></section></main><script>requireAuth().then(async()=>{const {data}=await supabaseClient.from('factures').select('montant_paye,statut_paiement');if(data){collected.textContent=money(data.reduce((s,x)=>s+Number(x.montant_paye||0),0));late.textContent=data.filter(x=>x.statut_paiement==='EN_RETARD').length;today.textContent='-'}})</script></body></html>
