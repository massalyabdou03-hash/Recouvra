<head>
<meta charset="UTF-8">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4F46E5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
<div class="sidebar-overlay" onclick="toggleSidebar()"></div>

<div class="app">
  <nav class="sidebar">
    <div class="brand">
      <img data-company-logo src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234F46E5'/%3E%3Cpath d='M7 12h10M12 7v10' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E" class="brand-logo" alt="Logo">
      <span data-company-name>Ma Boutique</span>
    </div>

    <div class="nav-section">
      <div class="nav-section-title">Mon Quotidien</div>
      <a href="index.html" class="nav-link"><span class="nav-emoji">🏠</span> Accueil</a>
      <a href="factures.html" class="nav-link"><span class="nav-emoji">🧾</span> Vendre</a>
      <a href="clients.html" class="nav-link"><span class="nav-emoji">👥</span> Mes Clients</a>
    </div>

    <div class="nav-section">
      <div class="nav-section-title">Mon Stock</div>
      <a href="catalogue.html" class="nav-link"><span class="nav-emoji">📦</span> Mes Articles</a>
      <a href="stock.html" class="nav-link"><span class="nav-emoji">📊</span> Stock & Produits</a>
    </div>

    <div class="nav-section">
      <div class="nav-section-title">Mon Argent</div>
      <a href="credits.html" class="nav-link"><span class="nav-emoji">💸</span> On me doit</a>
      <a href="recouvra.html" class="nav-link premium active"><span class="nav-emoji">📣</span> Relancer <span class="badge-premium">PRO</span></a>
    </div>

    <div class="sidebar-footer">
      <button class="dark-mode-toggle" onclick="toggleDarkMode()" style="width:100%; margin-bottom:8px;"><span id="dark-mode-icon">🌙</span> <span id="dark-mode-label">Mode sombre</span></button>
      <div class="hint mono" id="current-user-email" style="margin-bottom:8px;"></div>
      <button class="btn-logout" onclick="logout()">Déconnexion</button>
    </div>
  </nav>

  <main class="main">
    <div class="page-header-simple">
      <h1>📣 Relancer mes clients</h1>
      <p>Envoyez un rappel WhatsApp aux clients qui ont des impayés.</p>
    </div>

    <div class="relance-stats">
      <div class="relance-stat-card danger"><span class="relance-stat-value" id="stat-total">—</span><span class="relance-stat-label">Total dû</span></div>
      <div class="relance-stat-card danger"><span class="relance-stat-value" id="stat-retard">—</span><span class="relance-stat-label">En retard</span></div>
      <div class="relance-stat-card"><span class="relance-stat-value" id="stat-clients">—</span><span class="relance-stat-label">Clients à relancer</span></div>
    </div>

    <div class="relance-list" id="relance-list">
      <div class="empty-state">Chargement...</div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>
function toggleSidebar() { const sidebar = document.querySelector('.sidebar'); const overlay = document.querySelector('.sidebar-overlay'); if (sidebar) sidebar.classList.toggle('open'); if (overlay) overlay.classList.toggle('active'); document.body.classList.toggle('menu-open', sidebar?.classList.contains('open')); }
document.addEventListener('click', (e) => { if (e.target.closest('.nav-link')) { const sidebar = document.querySelector('.sidebar'); const overlay = document.querySelector('.sidebar-overlay'); if (sidebar) sidebar.classList.remove('open'); if (overlay) overlay.classList.remove('active'); document.body.classList.remove('menu-open'); } });
function toggleDarkMode() { document.body.classList.toggle('dark-mode'); const isDark = document.body.classList.contains('dark-mode'); localStorage.setItem('recouvra_dark_mode', isDark ? '1' : '0'); const icon = document.getElementById('dark-mode-icon'); const label = document.getElementById('dark-mode-label'); if (icon) icon.textContent = isDark ? '☀️' : '🌙'; if (label) label.textContent = isDark ? 'Mode clair' : 'Mode sombre'; }
function initDarkMode() { if (localStorage.getItem('recouvra_dark_mode') === '1') { document.body.classList.add('dark-mode'); const icon = document.getElementById('dark-mode-icon'); const label = document.getElementById('dark-mode-label'); if (icon) icon.textContent = '☀️'; if (label) label.textContent = 'Mode clair'; } }

let allDebts = [];

document.addEventListener('DOMContentLoaded', async () => {
    initDarkMode();
    const session = await requireAuth();
    if (!session) return;

    // Vérifier l'accès Recouvra
    const { data: profile } = await supabaseClient
        .from('profiles')
        .select('has_recouvra')
        .eq('id', session.user.id)
        .single();

    if (!profile?.has_recouvra) {
        window.location.href = 'abonnement.html';
        return;
    }

    await loadDebts();
});

async function loadDebts() {
    const el = document.getElementById('relance-list');
    el.innerHTML = '<div class="empty-state">Chargement...</div>';

    try {
        await supabaseClient.rpc('verifier_promesses');

        const { data, error } = await supabaseClient
            .from('factures')
            .select('*, clients(nom, telephone)')
            .eq('statut', 'VALIDEE')
            .gt('montant_restant', 0)
            .order('date_echeance', { ascending: true });

        if (error) throw error;

        allDebts = data || [];

        const totalDu = allDebts.reduce((s, f) => s + Number(f.montant_restant), 0);
        const enRetard = allDebts.filter(f => f.date_echeance && new Date(f.date_echeance) < new Date());
        const clientsAvecDette = new Set(allDebts.map(f => f.client_id)).size;

        document.getElementById('stat-total').textContent = fmtMoney(totalDu);
        document.getElementById('stat-retard').textContent = enRetard.length;
        document.getElementById('stat-clients').textContent = clientsAvecDette;

        renderDebts();
    } catch (error) {
        console.error('Erreur chargement dettes:', error);
        el.innerHTML = `<div class="error-msg">${friendlyError(error)}</div>`;
    }
}

function renderDebts() {
    const el = document.getElementById('relance-list');

    if (allDebts.length === 0) {
        el.innerHTML = `<div class="empty-state">✅ Aucun impayé — tous vos clients sont à jour !</div>`;
        return;
    }

    const groups = new Map();
    allDebts.forEach(f => {
        const key = f.client_id;
        if (!groups.has(key)) {
            groups.set(key, { nom: f.clients?.nom || 'Client', telephone: f.clients?.telephone || '', total: 0, factures: [] });
        }
        const g = groups.get(key);
        g.total += Number(f.montant_restant);
        g.factures.push(f);
    });

    el.innerHTML = [...groups.values()].map(g => {
        const hasPhone = g.telephone && g.telephone.replace(/\D/g, '').length > 0;
        return `
            <div class="relance-client-card">
                <div class="relance-client-header">
                    <div class="relance-client-info">
                        <div class="relance-client-name">${esc(g.nom)}</div>
                        <div class="relance-client-phone">${g.telephone ? '📞 ' + esc(g.telephone) : '⚠️ Pas de téléphone'}</div>
                    </div>
                    <div class="relance-client-total">
                        <span class="relance-total-label">Doit</span>
                        <span class="relance-total-amount">${fmtMoney(g.total)}</span>
                    </div>
                </div>
                <div class="relance-invoices">
                    ${g.factures.map(f => {
                        const echDate = f.date_echeance ? new Date(f.date_echeance) : null;
                        const today = new Date();
                        const isLate = echDate && echDate < today;
                        return `
                            <div class="relance-invoice-row">
                                <div class="relance-invoice-info">
                                    <span class="relance-invoice-num">${esc(f.numero_facture || '—')}</span>
                                    <span class="relance-invoice-date">Échéance: ${fmtDate(f.date_echeance)}</span>
                                </div>
                                <div class="relance-invoice-amount">
                                    <span class="relance-invoice-montant">${fmtMoney(f.montant_restant)}</span>
                                    ${isLate ? '<span class="badge badge-danger">En retard</span>' : ''}
                                </div>
                            </div>`;
                    }).join('')}
                </div>
                <div class="relance-actions">
                    ${hasPhone ? `<button class="btn-whatsapp" onclick="relancerWhatsApp(${g.factures[0].id})">💬 Relancer sur WhatsApp</button>` : `<button class="btn btn-secondary" onclick="showToast('Ce client n\'a pas de numéro de téléphone enregistré.', 'error')">⚠️ Pas de téléphone</button>`}
                </div>
            </div>`;
    }).join('');
}

async function relancerWhatsApp(factureId) {
    try {
        const facture = allDebts.find(f => f.id === factureId);
        if (!facture?.clients?.telephone) { showToast('Ce client n\'a pas de numéro de téléphone.', 'error'); return; }

        await supabaseClient
            .from('relances')
            .insert({ facture_id: facture.id, client_id: facture.client_id, canal: 'WHATSAPP', message: generateMessage(facture) });

        const message = generateMessage(facture);
        const phone = facture.clients.telephone.replace(/\D/g, '');
        const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
        window.open(url, '_blank');
        showToast('Relance WhatsApp préparée.', 'success');
    } catch (error) {
        showToast(friendlyError(error), 'error');
    }
}

function generateMessage(facture) {
    const settings = JSON.parse(localStorage.getItem('sylla_company_settings') || '{}');
    const companyName = settings.nom_commercial || 'Ma Boutique';
    const montant = fmtMoney(facture.montant_restant);
    const numero = facture.numero_facture || `#${facture.id}`;

    return `Bonjour ${facture.clients?.nom || ''},

Nous vous rappelons que la facture ${numero} d'un montant de ${montant} est arrivée à échéance.

Merci de bien vouloir procéder au règlement dès que possible.

Cordialement,
${companyName}`;
}
</script>
</body>
</html>
