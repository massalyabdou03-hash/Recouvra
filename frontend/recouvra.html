<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relancer — Ma Boutique</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234F46E5'/%3E%3Cpath d='M7 12h10M12 7v10' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4F46E5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ma Boutique">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/style.css">

<style>
/* ============================================================================
   MENU MOBILE + MODE SOMBRE GLOBAL
   ============================================================================ */

.mobile-menu-btn {
    display: none;
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 1001;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    border: none;
    background: #4F46E5;
    color: white;
    font-size: 24px;
    cursor: pointer;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 12px rgba(79,70,229,0.3);
}

.sidebar-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 999;
}

.sidebar-overlay.active {
    display: block;
}

@media (max-width: 768px) {
    .mobile-menu-btn {
        display: flex;
    }
    .sidebar {
        position: fixed;
        top: 0;
        left: -280px;
        width: 280px;
        height: 100vh;
        transition: left 0.3s ease;
        z-index: 1000;
        overflow-y: auto;
    }
    .sidebar.open {
        left: 0;
    }
    .main {
        padding-left: 16px;
        padding-right: 16px;
        padding-top: 60px;
    }
}

body.dark-mode {
    --surface: #1F2937;
    --surface-2: #374151;
    --surface-3: #4B5563;
    --border: #4B5563;
    --border-soft: #374151;
    --text: #F9FAFB;
    --text-muted: #9CA3AF;
    --text-light: #6B7280;
    background: #111827;
    color: #F9FAFB;
}

body.dark-mode .card,
body.dark-mode .sidebar {
    background: #1F2937;
    border-color: #374151;
}

body.dark-mode .nav-link {
    color: #9CA3AF;
}

body.dark-mode .nav-link.active {
    background: #4F46E5;
    color: white;
}

body.dark-mode table {
    background: #1F2937;
}

body.dark-mode th {
    background: #374151;
    color: #9CA3AF;
}

body.dark-mode td {
    border-color: #374151;
}

body.dark-mode input,
body.dark-mode select,
body.dark-mode textarea {
    background: #374151;
    border-color: #4B5563;
    color: #F9FAFB;
}

body.dark-mode .btn-secondary {
    background: #374151;
    border-color: #4B5563;
    color: #F9FAFB;
}

body.dark-mode .empty-state {
    color: #9CA3AF;
}

body.dark-mode .hint {
    color: #9CA3AF;
}

/* ============================================================================
   PAGE RELANCER - CARTES CLIENTS AVEC DETTE
   ============================================================================ */

.page-header-simple {
    margin-bottom: 24px;
}

.page-header-simple h1 {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 4px;
}

.page-header-simple p {
    color: #888;
    font-size: 15px;
}

.relance-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
}

.relance-stat-card {
    background: white;
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    border: 1px solid #eee;
}

.relance-stat-card.danger {
    background: #FEE2E2;
    border-color: #EF4444;
}

.relance-stat-value {
    font-size: 28px;
    font-weight: 800;
    display: block;
    margin-bottom: 4px;
}

.relance-stat-label {
    font-size: 12px;
    color: #888;
    font-weight: 600;
    text-transform: uppercase;
}

.relance-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.relance-client-card {
    background: white;
    border-radius: 16px;
    padding: 20px;
    border: 1px solid #eee;
}

.relance-client-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid #f3f4f6;
}

.relance-client-info {
    flex: 1;
}

.relance-client-name {
    font-weight: 700;
    font-size: 18px;
    margin-bottom: 4px;
}

.relance-client-phone {
    font-size: 13px;
    color: #888;
}

.relance-client-total {
    text-align: right;
}

.relance-total-label {
    font-size: 12px;
    color: #888;
    display: block;
    margin-bottom: 2px;
}

.relance-total-amount {
    font-size: 24px;
    font-weight: 800;
    color: #EF4444;
}

.relance-invoices {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
}

.relance-invoice-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px;
    background: #fafafa;
    border-radius: 8px;
}

.relance-invoice-info {
    flex: 1;
}

.relance-invoice-num {
    font-weight: 600;
    font-size: 14px;
    display: block;
}

.relance-invoice-date {
    font-size: 12px;
    color: #888;
}

.relance-invoice-amount {
    text-align: right;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
}

.relance-invoice-montant {
    font-weight: 700;
    font-size: 16px;
}

.relance-actions {
    display: flex;
    justify-content: flex-end;
}

.btn-whatsapp {
    background: #25D366;
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.btn-whatsapp:hover {
    background: #1DA851;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
}

body.dark-mode .relance-client-card {
    background: #1F2937;
    border-color: #374151;
}

body.dark-mode .relance-invoice-row {
    background: #374151;
}

body.dark-mode .relance-stat-card {
    background: #1F2937;
    border-color: #374151;
}

body.dark-mode .relance-client-name {
    color: #F9FAFB;
}

/* --- Responsive --- */
@media (max-width: 600px) {
    .relance-client-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
    }
    
    .relance-client-total {
        text-align: left;
    }
    
    .relance-actions {
        justify-content: stretch;
    }
    
    .btn-whatsapp {
        width: 100%;
        justify-content: center;
    }
}
</style>
</head>
<body>

<!-- ========== MENU MOBILE ========== -->
<button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
<div class="sidebar-overlay" onclick="toggleSidebar()"></div>

<div class="app">
  <nav class="sidebar">
    <div class="brand">
      <img data-company-logo src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234F46E5'/%3E%3Cpath d='M7 12h10M12 7v10' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E" class="brand-logo" alt="Logo">
      <span data-company-name>Ma Boutique</span>
    </div>

    <div class="nav-section">
      <div class="nav-section-title">Mon Quotidien</div>
      <a href="index.html" class="nav-link">
        <span class="nav-emoji">🏠</span> Accueil
      </a>
      <a href="factures.html" class="nav-link">
        <span class="nav-emoji">🧾</span> Vendre
      </a>
      <a href="clients.html" class="nav-link">
        <span class="nav-emoji">👥</span> Mes Clients
      </a>
    </div>

    <div class="nav-section">
      <div class="nav-section-title">Mon Stock</div>
      <a href="catalogue.html" class="nav-link">
        <span class="nav-emoji">📦</span> Mes Articles
      </a>
      <a href="stock.html" class="nav-link">
        <span class="nav-emoji">📊</span> Stock & Produits
      </a>
    </div>

    <div class="nav-section">
      <div class="nav-section-title">Mon Argent</div>
      <a href="credits.html" class="nav-link">
        <span class="nav-emoji">💸</span> On me doit
      </a>
      <a href="recouvra.html" class="nav-link premium active">
        <span class="nav-emoji">📣</span> Relancer
        <span class="badge-premium">PRO</span>
      </a>
    </div>

    <div class="sidebar-footer">
      <!-- ========== MODE SOMBRE ========== -->
      <button class="dark-mode-toggle" onclick="toggleDarkMode()" style="width:100%; margin-bottom:8px;">
        <span id="dark-mode-icon">🌙</span>
        <span id="dark-mode-label">Mode sombre</span>
      </button>
      
      <div class="hint mono" id="current-user-email" style="margin-bottom:8px;"></div>
      <button class="btn-logout" onclick="logout()">Déconnexion</button>
    </div>
  </nav>

  <main class="main">
    
    <div class="page-header-simple">
      <h1>📣 Relancer mes clients</h1>
      <p>Envoyez un rappel WhatsApp aux clients qui ont des impayés.</p>
    </div>

    <!-- Statistiques rapides -->
    <div class="relance-stats">
      <div class="relance-stat-card danger">
        <span class="relance-stat-value" id="stat-total">—</span>
        <span class="relance-stat-label">Total dû</span>
      </div>
      <div class="relance-stat-card danger">
        <span class="relance-stat-value" id="stat-retard">—</span>
        <span class="relance-stat-label">En retard</span>
      </div>
      <div class="relance-stat-card">
        <span class="relance-stat-value" id="stat-clients">—</span>
        <span class="relance-stat-label">Clients à relancer</span>
      </div>
    </div>

    <!-- Liste des clients à relancer -->
    <div class="relance-list" id="relance-list">
      <div class="empty-state">Chargement...</div>
    </div>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>
// ============================================================================
// MENU MOBILE + MODE SOMBRE
// ============================================================================

function toggleSidebar() {
    const sidebar = document.querySelector('.sidebar');
    const overlay = document.querySelector('.sidebar-overlay');
    if (sidebar) sidebar.classList.toggle('open');
    if (overlay) overlay.classList.toggle('active');
}

document.addEventListener('click', (e) => {
    if (e.target.closest('.nav-link')) {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.sidebar-overlay');
        if (sidebar) sidebar.classList.remove('open');
        if (overlay) overlay.classList.remove('active');
    }
});

function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    localStorage.setItem('recouvra_dark_mode', isDark ? '1' : '0');
    const icon = document.getElementById('dark-mode-icon');
    const label = document.getElementById('dark-mode-label');
    if (icon) icon.textContent = isDark ? '☀️' : '🌙';
    if (label) label.textContent = isDark ? 'Mode clair' : 'Mode sombre';
}

function initDarkMode() {
    if (localStorage.getItem('recouvra_dark_mode') === '1') {
        document.body.classList.add('dark-mode');
        const icon = document.getElementById('dark-mode-icon');
        const label = document.getElementById('dark-mode-label');
        if (icon) icon.textContent = '☀️';
        if (label) label.textContent = 'Mode clair';
    }
}

// ============================================================================
// RELANCER - LOGIQUE
// ============================================================================

let allDebts = [];

document.addEventListener('DOMContentLoaded', async () => {
    initDarkMode();
    
    const session = await requireAuth();
    if (!session) return;

    // Vérifier l'accès Recouvra
    const { data: profile } = await supabaseClient
        .from('profiles')
        .select('has_recouvra')
        .eq('id', session.user.id)
        .single();

    if (!profile?.has_recouvra) {
        window.location.href = 'abonnement.html';
        return;
    }

    await loadDebts();
});

async function loadDebts() {
    const el = document.getElementById('relance-list');
    el.innerHTML = '<div class="empty-state">Chargement...</div>';

    try {
        // Vérifier les promesses en retard
        await supabaseClient.rpc('verifier_promesses');

        const { data, error } = await supabaseClient
            .from('factures')
            .select(`
                *,
                clients(nom, telephone)
            `)
            .eq('statut', 'VALIDEE')
            .gt('montant_restant', 0)
            .order('date_echeance', { ascending: true });

        if (error) throw error;

        allDebts = data || [];

        // Mettre à jour les stats
        const totalDu = allDebts.reduce((s, f) => s + Number(f.montant_restant), 0);
        const enRetard = allDebts.filter(f => f.date_echeance && new Date(f.date_echeance) < new Date());
        const clientsAvecDette = new Set(allDebts.map(f => f.client_id)).size;

        document.getElementById('stat-total').textContent = fmtMoney(totalDu);
        document.getElementById('stat-retard').textContent = enRetard.length;
        document.getElementById('stat-clients').textContent = clientsAvecDette;

        renderDebts();
    } catch (error) {
        console.error('Erreur chargement dettes:', error);
        el.innerHTML = `<div class="error-msg">${friendlyError(error)}</div>`;
    }
}

function renderDebts() {
    const el = document.getElementById('relance-list');

    if (allDebts.length === 0) {
        el.innerHTML = `<div class="empty-state">✅ Aucun impayé — tous vos clients sont à jour !</div>`;
        return;
    }

    // Regrouper par client
    const groups = new Map();
    allDebts.forEach(f => {
        const key = f.client_id;
        if (!groups.has(key)) {
            groups.set(key, {
                nom: f.clients?.nom || 'Client',
                telephone: f.clients?.telephone || '',
                total: 0,
                factures: []
            });
        }
        const g = groups.get(key);
        g.total += Number(f.montant_restant);
        g.factures.push(f);
    });

    el.innerHTML = [...groups.values()].map(g => {
        const hasPhone = g.telephone && g.telephone.replace(/\D/g, '').length > 0;
        
        return `
            <div class="relance-client-card">
                <div class="relance-client-header">
                    <div class="relance-client-info">
                        <div class="relance-client-name">${esc(g.nom)}</div>
                        <div class="relance-client-phone">${g.telephone ? '📞 ' + esc(g.telephone) : '⚠️ Pas de téléphone'}</div>
                    </div>
                    <div class="relance-client-total">
                        <span class="relance-total-label">Doit</span>
                        <span class="relance-total-amount">${fmtMoney(g.total)}</span>
                    </div>
                </div>
                
                <div class="relance-invoices">
                    ${g.factures.map(f => {
                        const echDate = f.date_echeance ? new Date(f.date_echeance) : null;
                        const today = new Date();
                        const isLate = echDate && echDate < today;
                        
                        return `
                            <div class="relance-invoice-row">
                                <div class="relance-invoice-info">
                                    <span class="relance-invoice-num">${esc(f.numero_facture || '—')}</span>
                                    <span class="relance-invoice-date">Échéance: ${fmtDate(f.date_echeance)}</span>
                                </div>
                                <div class="relance-invoice-amount">
                                    <span class="relance-invoice-montant">${fmtMoney(f.montant_restant)}</span>
                                    ${isLate ? '<span class="badge badge-danger">En retard</span>' : ''}
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
                
                <div class="relance-actions">
                    ${hasPhone ? `
                        <button class="btn-whatsapp" onclick="relancerWhatsApp(${g.factures[0].id})">
                            💬 Relancer sur WhatsApp
                        </button>
                    ` : `
                        <button class="btn btn-secondary" onclick="showToast('Ce client n\'a pas de numéro de téléphone enregistré.', 'error')">
                            ⚠️ Pas de téléphone
                        </button>
                    `}
                </div>
            </div>
        `;
    }).join('');
}

async function relancerWhatsApp(factureId) {
    try {
        const facture = allDebts.find(f => f.id === factureId);
        if (!facture?.clients?.telephone) {
            showToast('Ce client n\'a pas de numéro de téléphone.', 'error');
            return;
        }

        // Enregistrer la relance
        await supabaseClient
            .from('relances')
            .insert({
                facture_id: facture.id,
                client_id: facture.client_id,
                canal: 'WHATSAPP',
                message: generateMessage(facture),
            });

        // Construire le message
        const message = generateMessage(facture);
        const phone = facture.clients.telephone.replace(/\D/g, '');
        const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;

        window.open(url, '_blank');
        showToast('Relance WhatsApp préparée.', 'success');

    } catch (error) {
        showToast(friendlyError(error), 'error');
    }
}

function generateMessage(facture) {
    const settings = JSON.parse(localStorage.getItem('sylla_company_settings') || '{}');
    const companyName = settings.nom_commercial || 'Ma Boutique';
    const montant = fmtMoney(facture.montant_restant);
    const numero = facture.numero_facture || `#${facture.id}`;

    return `Bonjour ${facture.clients?.nom || ''},

Nous vous rappelons que la facture ${numero} d'un montant de ${montant} est arrivée à échéance.

Merci de bien vouloir procéder au règlement dès que possible.

Cordialement,
${companyName}`;
}
</script>
</body>
</html>
